<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Teoria — ARQUIVO X-BR</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#080b0f; --bg-1:#0d1218; --bg-2:#121820;
    --line:#233040; --line-soft:#1a232d;
    --phosphor:#4fe3a8; --phosphor-dim:#2c8a67;
    --amber:#e2a23b; --stamp:#c1443a;
    --text:#d6e2df; --text-dim:#8296a0; --text-faint:#4c5a63;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{background:var(--bg-0); color:var(--text); font-family:'IBM Plex Mono', monospace; line-height:1.6; min-height:100vh;}
  ::selection{background:var(--phosphor); color:#04120b;}
  body::before{
    content:""; position:fixed; inset:0;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,0.018) 0px, rgba(255,255,255,0.018) 1px, transparent 1px, transparent 3px);
    pointer-events:none; z-index:9999; mix-blend-mode:overlay;
  }
  .wrap{max-width:820px; margin:0 auto; padding:0 28px;}

  header.topbar{position:sticky; top:0; z-index:100; background:rgba(8,11,15,0.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--line);}
  .topbar-inner{max-width:820px; margin:0 auto; padding:14px 28px; display:flex; align-items:center; justify-content:space-between;}
  .brand{font-family:'Oswald', sans-serif; font-weight:700; letter-spacing:0.14em; font-size:15px; color:var(--phosphor); display:flex; align-items:center; gap:10px; text-decoration:none;}
  .brand .dot{width:7px; height:7px; border-radius:50%; background:var(--stamp); box-shadow:0 0 8px var(--stamp); animation:blink 2.4s infinite;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:0.25;}}
  nav.toplinks{display:flex; gap:22px; font-size:11px; letter-spacing:0.06em; color:var(--text-dim);}
  nav.toplinks a{color:var(--text-dim); text-decoration:none; text-transform:uppercase;}
  nav.toplinks a:hover{color:var(--phosphor);}
  @media (max-width:600px){nav.toplinks{display:none;}}

  .back-link{display:inline-flex; align-items:center; gap:8px; color:var(--text-dim); text-decoration:none; font-size:12px; text-transform:uppercase; letter-spacing:0.06em; margin:32px 0 24px;}
  .back-link:hover{color:var(--phosphor);}

  .theory-badge{display:inline-block; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; padding:5px 12px; margin-bottom:20px; border-radius:2px;}
  .cat-ciencia_distorcida{background:rgba(79,227,168,0.12); color:var(--phosphor);}
  .cat-geomitologia{background:rgba(226,162,59,0.14); color:var(--amber);}
  .cat-fraude{background:rgba(226,162,59,0.14); color:var(--amber);}
  .cat-movimento{background:rgba(226,162,59,0.14); color:var(--amber);}
  .cat-conspiracao{background:rgba(193,68,58,0.16); color:var(--stamp);}

  h1.detail-title{font-family:'Oswald', sans-serif; font-weight:700; font-size:clamp(28px,4.5vw,44px); text-transform:uppercase; color:#eef4f2; line-height:1.05;}
  .detail-periodo{color:var(--text-faint); font-size:12px; margin-top:10px; text-transform:uppercase; letter-spacing:0.05em;}

  .block{margin:28px 0; padding:22px 24px; background:var(--bg-1); border:1px solid var(--line);}
  .block.principal{border-left:3px solid var(--phosphor);}
  .block.distorcao{border-left:3px solid var(--stamp);}
  .block .tag{display:block; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; margin-bottom:12px;}
  .block.principal .tag{color:var(--phosphor);}
  .block.distorcao .tag{color:var(--stamp);}
  .block p{font-size:14px; color:var(--text-dim);}

  .detail-nav{display:grid; grid-template-columns:1fr 1fr; gap:16px; border-top:1px solid var(--line-soft); padding-top:28px; margin:36px 0 60px;}
  .detail-nav a{display:block; text-decoration:none; color:var(--text-dim); border:1px solid var(--line); padding:16px 18px; font-size:12px;}
  .detail-nav a:hover{border-color:var(--phosphor-dim); color:var(--text);}
  .detail-nav .dir{font-size:10px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-faint); display:block; margin-bottom:6px;}
  .detail-nav .next{text-align:right;}

  .empty-msg{color:var(--text-faint); font-size:14px; padding:60px 0; text-align:center;}
  footer{border-top:1px solid var(--line-soft); padding:32px 0 50px; font-size:11px; color:var(--text-faint);}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="index.html" class="brand"><span class="dot"></span>ARQUIVO X-BR</a>
    <nav class="toplinks">
      <a href="index.html#criptopaleontologia">Criptopaleontologia</a>
      <a href="index.html#entidades">Entidades</a>
      <a href="index.html#criptideos">Criptídeos</a>
      <a href="conspiracoes.html" style="color:var(--stamp);">Conspirações</a>
    </nav>
  </div>
</header>

<div class="wrap">
  <a href="index.html#criptopaleontologia" class="back-link">← Voltar ao catálogo</a>
  <div id="content">
    <p class="empty-msg">Carregando ficha...</p>
  </div>
</div>

<footer><div class="wrap">Compilação não oficial · teorias de fronteira em circulação popular, sem confirmação científica.</div></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://aewcxqzpbipwcdpsjfht.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_mINpOQLVbi0pilHc9bEtBA_l1a0o6c6';

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { db: { schema: 'ufologia' } });

  const CATEGORIA_CLASS = {
    'Ciência real distorcida': 'cat-ciencia_distorcida',
    'Geomitologia': 'cat-geomitologia',
    'Fraude documentada': 'cat-fraude',
    'Movimento organizado': 'cat-movimento',
    'Conspiração': 'cat-conspiracao'
  };

  function esc(str) {
    if (str == null) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  async function loadTeoria() {
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug');
    const content = document.getElementById('content');

    if (!slug) {
      content.innerHTML = '<p class="empty-msg">Nenhum registro especificado.</p>';
      return;
    }

    const { data: all, error } = await sb
      .from('criptopaleontologia')
      .select('*')
      .eq('publicado', true)
      .order('ordem', { ascending: true });

    if (error || !all || all.length === 0) {
      content.innerHTML = '<p class="empty-msg">Não foi possível carregar o catálogo agora.</p>';
      return;
    }

    const idx = all.findIndex(t => t.slug === slug);
    if (idx === -1) {
      content.innerHTML = '<p class="empty-msg">Registro não encontrado ou não publicado.</p>';
      return;
    }

    const t = all[idx];
    const prev = all[(idx - 1 + all.length) % all.length];
    const next = all[(idx + 1) % all.length];
    const catClass = CATEGORIA_CLASS[t.categoria] || 'cat-ciencia_distorcida';

    document.title = `${t.titulo} — ARQUIVO X-BR`;

    content.innerHTML = `
      <span class="theory-badge ${catClass}">${esc(t.categoria)}</span>
      <h1 class="detail-title">${esc(t.titulo)}</h1>
      ${t.periodo ? `<div class="detail-periodo">${esc(t.periodo)}</div>` : ''}

      ${t.descricao ? `
        <div class="block principal">
          <span class="tag">● Contexto e ciência estabelecida</span>
          <p>${esc(t.descricao)}</p>
        </div>
      ` : ''}

      ${t.teoria_conspiracao ? `
        <div class="block distorcao">
          <span class="tag">● Teoria da conspiração</span>
          <p>${esc(t.teoria_conspiracao)}</p>
        </div>
      ` : ''}

      <div class="detail-nav">
        <a href="teoria.html?slug=${encodeURIComponent(prev.slug)}" class="prev"><span class="dir">← Anterior</span>${esc(prev.titulo)}</a>
        <a href="teoria.html?slug=${encodeURIComponent(next.slug)}" class="next"><span class="dir">Próxima →</span>${esc(next.titulo)}</a>
      </div>
    `;
  }

  loadTeoria();
</script>

</body>
</html>
