  <!-- disco voador -->
  <ellipse cx="32" cy="30" rx="19" ry="5.5" fill="#c9d6d3"/>
  <ellipse cx="32" cy="30" rx="19" ry="5.5" fill="none" stroke="#4fe3a8" stroke-width="1.6"/>
  <path d="M20 30 Q32 15 44 30" fill="#0d1218" stroke="#4fe3a8" stroke-width="1.6"/>
  <ellipse cx="32" cy="24" rx="8" ry="6" fill="#4fe3a8" opacity="0.9"/>

  <!-- luzes -->
  <circle cx="20" cy="30.5" r="1.6" fill="#e2a23b"/>
  <circle cx="32" cy="32.5" r="1.6" fill="#e2a23b"/>
  <circle cx="44" cy="30.5" r="1.6" fill="#e2a23b"/>

