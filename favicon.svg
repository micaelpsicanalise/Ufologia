<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#4fe3a8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4fe3a8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- fundo -->
  <rect width="64" height="64" rx="12" fill="#080b0f"/>

  <!-- brilho radar -->
  <circle cx="32" cy="27" r="26" fill="url(#glow)"/>

  <!-- aneis de radar -->
  <circle cx="32" cy="46" r="20" fill="none" stroke="#1a232d" stroke-width="1.5"/>
  <circle cx="32" cy="46" r="13" fill="none" stroke="#1a232d" stroke-width="1.5"/>

  <!-- feixe de luz do disco -->
